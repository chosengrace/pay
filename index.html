<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Chosen Grace</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px 16px;
      background-color: #f7f8fa;
      color: #222;
      margin: 0;
    }
    .card {
      max-width: 380px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h2 { margin: 0 0 6px; font-size: 19px; color: #111; }
    .vpa-box {
      background: #f1f4f8;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 15px;
      font-weight: 600;
      color: #1a365d;
      margin: 16px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .app-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 13px 0;
      margin: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      color: white;
    }
    .phonepe { background-color: #5f259f; }
    .gpay { background-color: #1a73e8; }
    .paytm { background-color: #00b9f5; }
    .qr-container { margin-top: 18px; border-top: 1px solid #eee; padding-top: 14px; }
    .qr-img { width: 170px; height: 170px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Chosen Grace Collective LLP</h2>
    <p style="color: #666; font-size: 13px; margin: 0 0 10px;">Select your preferred UPI app to pay</p>

    <!-- Tap to Copy UPI ID -->
    <div class="vpa-box">
      <span id="vpaText">biz.chosengr126@fbl</span>
      <button class="copy-btn" onclick="copyUPI()">Copy</button>
    </div>

    <!-- Direct App Links (Avoids WhatsApp Hijacking) -->
    <a id="phonepeBtn" class="app-btn phonepe" href="#">Pay via PhonePe</a>
    <a id="gpayBtn" class="app-btn gpay" href="#">Pay via Google Pay</a>
    <a id="paytmBtn" class="app-btn paytm" href="#">Pay via Paytm</a>

    <!-- Dynamic QR Display -->
    <div class="qr-container">
      <p style="font-size: 12px; color: #555; margin-bottom: 8px;">Or scan QR code to pay:</p>
      <img id="qrImg" class="qr-img" src="" alt="UPI QR Code">
    </div>
  </div>

  <script>
    const vpa = "biz.chosengr126@fbl";
    const name = encodeURIComponent("CHOSEN GRACE COLLECTIVE LLP");
    
    // Read optional ?am= parameter
    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('am') || '';
    
    let baseQuery = `pa=${vpa}&pn=${name}&cu=INR`;
    if (amount) {
      baseQuery += `&am=${encodeURIComponent(amount)}`;
    }

    // Set intent links directly on buttons (no auto-redirect on load)
    document.getElementById('phonepeBtn').href = `phonepe://pay?${baseQuery}`;
    document.getElementById('gpayBtn').href = `gpay://upi/pay?${baseQuery}`;
    document.getElementById('paytmBtn').href = `paytmmp://pay?${baseQuery}`;

    // Render dynamic QR
    const qrUrl = `upi://pay?${baseQuery}`;
    document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrUrl)}`;

    function copyUPI() {
      navigator.clipboard.writeText(vpa);
      alert("UPI ID copied! Open your UPI app and paste to pay.");
    }
  </script>
</body>
</html>
